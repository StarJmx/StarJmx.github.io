<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>指尖乾坤 · AI手势春节烟花</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: 'Microsoft YaHei', sans-serif;
            overflow: hidden;
        }
        /* 容器：层叠视频和Canvas */
        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        /* 视频层：镜像翻转，透明度降低以便看清粒子 */
        .input_video {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* 镜像 */
            opacity: 0.2; /* 让背景暗下来，突出烟花 */
            z-index: 0;
        }
        /* 画布层：在视频之上 */
        .output_canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
            transform: scaleX(-1); /* 也要镜像，保证手势位置对齐 */
        }
        /* UI 提示 */
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: #ffd700;
            text-align: center;
            z-index: 10;
            text-shadow: 0 0 20px #ff0000;
        }
        .instruction {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 18px;
            color: rgba(255, 255, 255, 0.8);
            z-index: 10;
            pointer-events: none;
            text-shadow: 0 0 5px #000;
        }
    </style>
    <!-- 引入 MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

<div class="container">
    <div id="loading">正在连接宇宙信号 (加载AI模型)...<br><span style="font-size:14px; color:#aaa;">请允许摄像头权限</span></div>
    <video class="input_video"></video>
    <canvas class="output_canvas"></canvas>
    <div class="instruction">👆 食指移动画出祥龙 | 👌 捏合拇指食指引爆烟花</div>
</div>

<script>
    // --- 1. 初始化设置 ---
    const videoElement = document.getElementsByClassName('input_video')[0];
    const canvasElement = document.getElementsByClassName('output_canvas')[0];
    const ctx = canvasElement.getContext('2d');
    const loadingDiv = document.getElementById('loading');
    
    let width, height;
    
    // 调整画布尺寸
    function resize() {
        width = canvasElement.width = window.innerWidth;
        height = canvasElement.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 粒子系统存储
    let particles = [];
    // 记录手势状态，避免重复触发
    let handState = {}; // key: handIndex, value: isPinching

    // --- 2. 粒子类定义 (视觉核心) ---
    class Particle {
        constructor(x, y, type) {
            this.x = x;
            this.y = y;
            this.type = type; // 'trail' (拖尾) 或 'firework' (烟花)
            this.life = 1.0;
            
            if (type === 'firework') {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 12 + 2; // 爆炸速度
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.decay = Math.random() * 0.015 + 0.01;
                this.gravity = 0.1;
                this.size = Math.random() * 4 + 1;
                
                // 烟花颜色：红、金、紫、青
                const palette = [
                    [255, 0, 0],    // 红
                    [255, 215, 0],  // 金
                    [255, 50, 50],  // 亮红
                    [0, 255, 255],  // 青 (科技感点缀)
                    [255, 0, 255]   // 紫
                ];
                const color = palette[Math.floor(Math.random() * palette.length)];
                this.r = color[0]; this.g = color[1]; this.b = color[2];

            } else {
                // 拖尾 (龙身)
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.decay = 0.04;
                this.gravity = 0;
                this.size = Math.random() * 15 + 5;
                // 拖尾颜色：金火色
                this.r = 255; 
                this.g = Math.floor(Math.random() * 150); // 0-150 (红到橙)
                this.b = 0;
            }
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.vy += this.gravity;
            
            // 阻力
            this.vx *= 0.95;
            this.vy *= 0.95;
            
            this.life -= this.decay;
        }

        draw(ctx) {
            ctx.save();
            ctx.globalAlpha = this.life;
            ctx.globalCompositeOperation = 'lighter'; // 关键：高光叠加
            ctx.fillStyle = `rgb(${this.r}, ${this.g}, ${this.b})`;
            
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }

    function createFirework(x, y) {
        // 爆炸闪光
        particles.push({
            x: x, y: y, type: 'flash', life: 5, 
            update: function(){ this.life--; }, 
            draw: function(c){ 
                c.save(); 
                c.globalAlpha = this.life / 10; 
                c.fillStyle = '#fff'; 
                c.fillRect(0,0,width,height); 
                c.restore(); 
            }
        });

        // 产生大量粒子
        for (let i = 0; i < 200; i++) {
            particles.push(new Particle(x, y, 'firework'));
        }
    }

    // --- 3. MediaPipe 手势处理 ---
    
    function onResults(results) {
        // 隐藏Loading
        loadingDiv.style.display = 'none';

        // 1. 清除画布 (带拖影效果)
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = 'rgba(0, 0, 0, 0.15)'; // 黑色背景，0.15透明度形成拖影
        ctx.fillRect(0, 0, width, height);

        // 2. 检测手势
        if (results.multiHandLandmarks) {
            for (let i = 0; i < results.multiHandLandmarks.length; i++) {
                const landmarks = results.multiHandLandmarks[i];
                
                // 获取关键点坐标 (MediaPipe返回的是0.0-1.0的归一化坐标)
                // 8: 食指指尖, 4: 拇指指尖
                const indexFinger = landmarks[8];
                const thumb = landmarks[4];
                
                const ix = indexFinger.x * width;
                const iy = indexFinger.y * height;
                const tx = thumb.x * width;
                const ty = thumb.y * height;

                // --- 互动 A: 画龙 (食指移动) ---
                // 在食指指尖生成“龙身”粒子
                for(let k=0; k<3; k++) {
                    particles.push(new Particle(ix + (Math.random()-0.5)*20, iy + (Math.random()-0.5)*20, 'trail'));
                }
                
                // 绘制一个明亮的光球在指尖
                ctx.beginPath();
                ctx.fillStyle = '#fff';
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#ffcc00';
                ctx.arc(ix, iy, 10, 0, Math.PI*2);
                ctx.fill();
                ctx.shadowBlur = 0;

                // --- 互动 B: 放烟花 (捏合检测) ---
                // 计算拇指和食指的距离
                const distance = Math.hypot(ix - tx, iy - ty);
                const pinchThreshold = 60; // 距离阈值，根据屏幕大小可能需要微调

                if (distance < pinchThreshold) {
                    if (!handState[i]) { // 如果之前没捏合，现在捏合了 -> 触发
                        createFirework((ix + tx) / 2, (iy + ty) / 2);
                        handState[i] = true; // 标记为已捏合
                    }
                } else {
                    handState[i] = false; // 松开
                }
            }
        } else {
            // 如果没有检测到手，也稍微刷一下背景防止拖影无限叠加
             ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
             ctx.fillRect(0, 0, width, height);
        }

        // 3. 更新和绘制所有粒子
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.update();
            p.draw(ctx);
            if (p.life <= 0) {
                particles.splice(i, 1);
            }
        }
    }

    // --- 4. 启动摄像头和AI模型 ---
    const hands = new Hands({locateFile: (file) => {
        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
    }});

    hands.setOptions({
        maxNumHands: 2, // 支持双手
        modelComplexity: 1,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
    });

    hands.onResults(onResults);

    const camera = new Camera(videoElement, {
        onFrame: async () => {
            await hands.send({image: videoElement});
        },
        width: 1280,
        height: 720
    });

    camera.start().catch(err => {
        console.error(err);
        loadingDiv.innerHTML = "摄像头启动失败。<br>请确保允许权限，并使用https或localhost环境运行。";
    });

</script>
</body>
</html>
